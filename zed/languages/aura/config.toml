name = "Aura"
grammar = "aura"
path_suffixes = ["aura"]
line_comments = ["// "]
block_comment = ["/*", "*/"]
autoclose_before = ";:.,=}])> \n\t"
tab_size = 4
hard_tabs = false

[format]
format_on_save = "on"

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false },
  { start = "`", end = "`", close = true, newline = false }
]

[language_servers]
auralsp = {}
